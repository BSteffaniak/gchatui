[advisories]
ignore = [
    # age enables RSA recipient compatibility transitively. gchatui generates and
    # uses Ed25519 identities only and never performs RSA private-key operations.
    "RUSTSEC-2023-0071",
]
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Branch-following bmux/sshenv Git dependencies intentionally have no version
# requirement. Source policy restricts the allowed Git repositories.
wildcards = "allow"

[sources]
allow-git = [
    "https://github.com/BSteffaniak/bmux.git",
    "https://github.com/BSteffaniak/sshenv.git",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "warn"
unknown-registry = "deny"
