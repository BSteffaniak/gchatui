name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes markdownlint-cli2 '**/*.md' '#target' '#.direnv'
      - run: ./scripts/check-public-safety.sh
