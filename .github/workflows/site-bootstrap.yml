name: Bootstrap Website State

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gchatui-site-production
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Ensure private R2 state bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          bucket = os.environ.get('R2_STATE_BUCKET', '')
          if not token or not re.fullmatch(r'[a-fA-F0-9]{32}', account):
              raise SystemExit('Cloudflare account/token configuration is missing or invalid.')
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{1,61}[a-z0-9]', bucket):
              raise SystemExit('R2_STATE_BUCKET must be a valid bucket name.')

          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/r2/buckets'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def request(url, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit('Cloudflare request failed; no response payload was logged.')
              if not result.get('success'):
                  raise SystemExit('Cloudflare rejected the request; no response payload was logged.')
              return 200, result

          status, _ = request(f'{base}/{bucket}')
          if status == 200:
              print('State bucket already exists; unchanged.')
          elif status == 404:
              status, _ = request(base, 'POST', {'name': bucket})
              if status != 200:
                  raise SystemExit(f'Bucket creation failed (HTTP {status}).')
              print('Private state bucket created. No public access configured.')
          else:
              raise SystemExit(f'Bucket lookup failed (HTTP {status}); nothing created.')
