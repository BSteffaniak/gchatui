name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, binary: gchatui }
          - { os: macos-latest, target: x86_64-apple-darwin, binary: gchatui }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, binary: gchatui }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: gchatui }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: gchatui.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          name="gchatui-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp README.md LICENSE docs/google-cloud-setup.md "dist/$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd dist && 7z a "$name.zip" "$name")
            certutil -hashfile "dist/$name.zip" SHA256 > "dist/$name.zip.sha256"
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gchatui-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
